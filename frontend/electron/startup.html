<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'">
  <title>Booting Internship Hub</title>
  <link rel="stylesheet" href="startup.css">
</head>
<body>
  <main class="startup" role="status" aria-live="polite">
    <div class="monitor" aria-hidden="true">
      <div class="monitor-screen">
        <span class="screen-light"></span>
        <span class="screen-line"></span>
        <span class="monitor-wordmark">ih<span>.</span></span>
        <span class="monitor-message">Booting<br>Internship Hub</span>
      </div>
      <div class="monitor-neck"></div>
      <div class="monitor-base"></div>
    </div>
    <h1>Booting Internship Hub</h1>
    <p>Preparing your workspace…</p>
    <div class="progress" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
